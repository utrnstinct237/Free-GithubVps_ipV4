on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt update
          sudo apt install -y curl unzip net-tools

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale
        run: |
          sudo tailscaled &
          sleep 8
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname=biralo --ssh

      - name: Create user
        run: |
          if ! id -u itz_ytansh >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash itz_ytansh
            echo "itz_ytansh:itz_ytansh" | sudo chpasswd
            sudo usermod -aG sudo itz_ytansh
            echo "itz_ytansh ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/itz_ytansh
          fi

      - name: Show Tailscale IP
        run: |
          echo "======================================"
          echo "TAILSCALE IP:"
          sudo tailscale ip -4
          echo "======================================"
          echo "SSH: ssh itz_ytansh@<IP above>"
          echo "Password: itz_ytansh"

      - name: Keep VPS alive for 6 hours
        run: sleep 21600
