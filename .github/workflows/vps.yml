on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt update
          sudo apt install -y curl unzip net-tools wget socat

      - name: Create user
        run: |
          if ! id -u itz_ytansh >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash itz_ytansh
            echo "itz_ytansh:itz_ytansh" | sudo chpasswd
            sudo usermod -aG sudo itz_ytansh
            echo "itz_ytansh ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/itz_ytansh
          fi

      - name: Download previous backup
        uses: actions/download-artifact@v4
        with:
          name: vps-backup
          path: ./backup
        continue-on-error: true

      - name: Install cloudflared
        run: |
          sudo wget -q -O /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          sudo /usr/local/bin/cloudflared --version

      - name: Install Xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
          sudo /usr/local/bin/xray version | head -1

      - name: Install 3x-ui panel
        run: |
          sudo bash -c "$(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh)" || true

      - name: Configure panel defaults
        run: |
          sudo /usr/local/x-ui/x-ui setting -port 17403
          sudo /usr/local/x-ui/x-ui setting -username Venom
          sudo /usr/local/x-ui/x-ui setting -password 'Venom@123'
          sudo /usr/local/x-ui/x-ui setting -webBasePath /panel-ops/
          sudo systemctl restart x-ui
          sleep 3
          sudo /usr/local/x-ui/x-ui setting -show

      - name: Restore backup if exists
        run: |
          if [ -f ./backup/vps-backup.tar.gz ]; then
            echo "=== Restoring backup ==="
            sudo tar -xzf ./backup/vps-backup.tar.gz -C /
            sudo systemctl restart x-ui
            echo "=== Backup restored ==="
          else
            echo "=== No backup, fresh start ==="
          fi

      - name: Start cloudflared tunnel
        run: |
          sudo nohup /usr/local/bin/cloudflared tunnel --no-autoupdate run --token ${{ secrets.CF_TUNNEL_TOKEN }} > /tmp/cf.log 2>&1 &
          sleep 12
          sudo grep "Registered tunnel" /tmp/cf.log | tail -2

      - name: Show status
        run: |
          echo "======================"
          echo "SSH:    ssh itz_ytansh@console.core-sync-23.de5.net"
          echo "Panel:  https://ops.core-sync-23.de5.net/panel-ops/"
          echo "User:   Venom"
          echo "Pass:   Venom@123"
          echo "======================"

      - name: Keep alive 5.5 hours
        run: sleep 19800

      - name: Backup before session ends
        if: always()
        run: |
          sudo mkdir -p /tmp/backup-root
          sudo cp -r /etc/x-ui /tmp/backup-root/ 2>/dev/null || true
          sudo cp -r /usr/local/etc/xray /tmp/backup-root/ 2>/dev/null || true
          sudo tar -czf vps-backup.tar.gz -C /tmp/backup-root . 2>/dev/null || true
          ls -lh vps-backup.tar.gz

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-backup
          path: vps-backup.tar.gz
          retention-days: 30
